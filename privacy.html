<h1>プライバシーポリシー</h1>
<p>gmail-sub は、開発者本人の Gmail アカウントの整理（メールの検索・閲覧・ラベル付け・アーカイブ・ゴミ箱への移動）のためだけに使う個人用ツールです。</p>
<ul>
<li>Google ユーザーデータは開発者本人のパソコン上でのみ処理し、第三者へ送信・販売・共有しません。</li>
<li>認証情報は本人のパソコン内にのみ保存します。</li>
<li>本人以外のユーザーには提供していません。</li>
</ul>
<p>gmail-sub による Google API から受け取った情報の使用は、限定使用の要件を含む <a href="https://developers.google.com/terms/api-services-user-data-policy">Google API Services User Data Policy</a> に従います。</p>
